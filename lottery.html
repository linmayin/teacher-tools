<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抽籤選號</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
h1{font-size:22px;font-weight:700;letter-spacing:2px;margin-bottom:20px;color:#e0d7ff}

/* 設定區 */
.settings{background:#16213e;border-radius:16px;padding:16px;width:100%;max-width:480px;margin-bottom:16px}
.settings-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.settings-row:last-child{margin-bottom:0}
.settings-row label{font-size:14px;color:#aaa;min-width:72px}
.settings-row input[type=number]{width:80px;padding:8px 10px;border-radius:8px;border:1px solid #333;background:#0f3460;color:#fff;font-size:16px;text-align:center}
.absent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;width:100%;margin-top:8px}
.absent-btn{padding:9px 4px;border-radius:8px;border:1.5px solid #444;background:#1a1a2e;color:#aaa;font-size:14px;font-weight:500;cursor:pointer;text-align:center;transition:all 0.15s}
.absent-btn.absent{background:#c0392b;border-color:#e74c3c;color:#fff}

/* 抽籤顯示 */
.lottery-box{width:100%;max-width:480px;background:#16213e;border-radius:20px;padding:24px 16px;text-align:center;margin-bottom:16px}
.result-label{font-size:13px;color:#888;margin-bottom:8px;letter-spacing:1px}
.result-num{font-size:88px;font-weight:800;line-height:1;color:#f5a623;text-shadow:0 0 30px rgba(245,166,35,0.6);min-height:110px;display:flex;align-items:center;justify-content:center;transition:color 0.2s}
.result-num.rolling{color:#a78bfa;text-shadow:0 0 20px rgba(167,139,250,0.5);font-size:72px}
.result-num.empty{color:#333;font-size:40px}
.stats{font-size:13px;color:#888;margin-top:8px}
.stats span{color:#e0d7ff;font-weight:600}

/* 按鈕 */
.btn-row{display:flex;gap:10px;width:100%;max-width:480px;margin-bottom:16px}
.btn{flex:1;padding:16px 8px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.15s;letter-spacing:0.5px}
.btn:active{transform:scale(0.96)}
.btn-draw{background:linear-gradient(135deg,#6c63ff,#a78bfa);color:#fff;box-shadow:0 4px 20px rgba(108,99,255,0.4)}
.btn-draw:disabled{background:#333;color:#666;box-shadow:none;cursor:not-allowed}
.btn-reset{background:#16213e;border:1.5px solid #444;color:#ccc}

/* 號碼總覽 */
.overview-title{font-size:13px;color:#888;margin-bottom:10px;letter-spacing:1px;width:100%;max-width:480px;text-align:left}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;width:100%;max-width:480px}
.ov-btn{padding:10px 4px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;transition:all 0.2s}
.ov-btn.available{background:#0f3460;color:#e0d7ff;border:1.5px solid #6c63ff}
.ov-btn.drawn{background:#2a2a2a;color:#444;border:1.5px solid #333}
.ov-btn.absent{background:#3a1a1a;color:#5a2a2a;border:1.5px solid #5a2a2a}
.ov-btn.current{background:#f5a623;color:#1a1a2e;border:1.5px solid #f5a623;box-shadow:0 0 12px rgba(245,166,35,0.5)}
</style>
</head>
<body>

<h1>🎲 抽籤選號</h1>

<!-- 設定 -->
<div class="settings">
  <div class="settings-row">
    <label>總人數</label>
    <input type="number" id="totalInput" value="33" min="1" max="60">
    <button class="btn" style="flex:none;padding:8px 14px;font-size:13px;border-radius:8px;border:1.5px solid #6c63ff;background:#0f3460;color:#a78bfa" onclick="applyTotal()">套用</button>
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start">
    <label style="margin-bottom:6px">點選缺席座號</label>
    <div class="absent-grid" id="absentGrid"></div>
  </div>
</div>

<!-- 抽籤結果 -->
<div class="lottery-box">
  <div class="result-label">本次抽中</div>
  <div class="result-num empty" id="resultNum">—</div>
  <div class="stats">剩餘可抽：<span id="remaining">0</span> 人 ／ 已抽：<span id="drawnCount">0</span> 人</div>
</div>

<!-- 按鈕 -->
<div class="btn-row">
  <button class="btn btn-draw" id="drawBtn" onclick="draw()">🎲 抽籤</button>
  <button class="btn btn-reset" onclick="reset()">🔄 重置</button>
</div>

<!-- 號碼總覽 -->
<div class="overview-title">號碼總覽</div>
<div class="overview-grid" id="overviewGrid"></div>

<script>
let total = 33;
let absentSet = new Set();
let drawnSet = new Set();
let currentNum = null;
let rolling = false;
let rollInterval = null;
let audioCtx = null;

function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playTick(){
  try{
    const ctx=getAudioCtx();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=600+Math.random()*400;
    o.type='sine';
    g.gain.setValueAtTime(0.08,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.05);
    o.start(); o.stop(ctx.currentTime+0.05);
  }catch(e){}
}

function playWin(){
  try{
    const ctx=getAudioCtx();
    const freqs=[523,659,784,1047];
    freqs.forEach((f,i)=>{
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=f; o.type='sine';
      const t=ctx.currentTime+i*0.12;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.15,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.start(t); o.stop(t+0.3);
    });
  }catch(e){}
}

function availableNums(){
  return Array.from({length:total},(_,i)=>i+1).filter(n=>!absentSet.has(n)&&!drawnSet.has(n));
}

function renderAbsentGrid(){
  const g=document.getElementById('absentGrid');
  g.innerHTML='';
  for(let i=1;i<=total;i++){
    const b=document.createElement('button');
    b.className='absent-btn'+(absentSet.has(i)?' absent':'');
    b.textContent=i;
    b.onclick=()=>{
      if(absentSet.has(i)) absentSet.delete(i);
      else absentSet.add(i);
      renderAll();
    };
    g.appendChild(b);
  }
}

function renderOverview(){
  const g=document.getElementById('overviewGrid');
  g.innerHTML='';
  for(let i=1;i<=total;i++){
    const b=document.createElement('div');
    let cls='ov-btn ';
    if(i===currentNum) cls+='current';
    else if(absentSet.has(i)) cls+='absent';
    else if(drawnSet.has(i)) cls+='drawn';
    else cls+='available';
    b.className=cls;
    b.textContent=i;
    g.appendChild(b);
  }
}

function updateStats(){
  const avail=availableNums();
  document.getElementById('remaining').textContent=avail.length;
  document.getElementById('drawnCount').textContent=drawnSet.size;
  const btn=document.getElementById('drawBtn');
  btn.disabled=avail.length===0;
  btn.textContent=avail.length===0?'✅ 全員抽完':'🎲 抽籤';
}

function renderAll(){
  renderAbsentGrid();
  renderOverview();
  updateStats();
}

function applyTotal(){
  const v=parseInt(document.getElementById('totalInput').value);
  if(isNaN(v)||v<1||v>60) return;
  total=v;
  absentSet=new Set([...absentSet].filter(n=>n<=total));
  drawnSet=new Set([...drawnSet].filter(n=>n<=total));
  currentNum=null;
  document.getElementById('resultNum').textContent='—';
  document.getElementById('resultNum').className='result-num empty';
  renderAll();
}

function draw(){
  if(rolling) return;
  const avail=availableNums();
  if(avail.length===0) return;

  rolling=true;
  document.getElementById('drawBtn').disabled=true;
  const el=document.getElementById('resultNum');
  el.className='result-num rolling';

  // 輪轉動畫
  let speed=40;
  let count=0;
  const maxRolls=28+Math.floor(Math.random()*12);
  const winner=avail[Math.floor(Math.random()*avail.length)];

  function roll(){
    // 顯示隨機號碼
    const rand=avail[Math.floor(Math.random()*avail.length)];
    el.textContent=rand;
    playTick();
    count++;

    // 逐漸減速
    if(count>maxRolls*0.6) speed=Math.min(speed+18,220);

    if(count>=maxRolls){
      clearInterval(rollInterval);
      // 最後顯示中獎號碼
      setTimeout(()=>{
        el.textContent=winner;
        el.className='result-num';
        currentNum=winner;
        drawnSet.add(winner);
        rolling=false;
        playWin();
        renderAll();
      },100);
    } else {
      clearInterval(rollInterval);
      rollInterval=setInterval(roll, speed);
    }
  }
  rollInterval=setInterval(roll, speed);
}

function reset(){
  drawnSet=new Set();
  currentNum=null;
  const el=document.getElementById('resultNum');
  el.textContent='—';
  el.className='result-num empty';
  renderAll();
}

// 初始化
renderAll();
</script>
</body>
</html>
