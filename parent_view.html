<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>學生生活常規查詢</title>
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--border:#e0dbd3;
  --text:#1a1814;--text2:#6b6560;--text3:#a09a93;
  --accent:#2d5be3;--accent-light:#edf0fd;
  --green:#1e7e4a;--green-bg:#edf7f2;
  --red:#c0392b;--red-bg:#fce8e8;
  --amber:#b45309;--amber-bg:#fef3c7;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;padding:20px 16px 40px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px}
h1{font-size:20px;font-weight:800;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--text3);margin-bottom:20px}
.field{margin-bottom:10px}
.field label{font-size:12px;color:var(--text3);display:block;margin-bottom:4px;font-weight:600}
input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:18px;text-align:center;font-weight:700;-webkit-appearance:none}
.btn{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.btn:active{opacity:.8}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-blue{background:var(--accent-light);color:var(--accent)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.item-row{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px}
.item-row:last-child{border-bottom:none}
.err{color:var(--red);font-size:14px;text-align:center;padding:12px}
.section-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin:14px 0 6px}
.merit-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.merit-row:last-child{border-bottom:none}
.big-num{font-size:32px;font-weight:800;line-height:1}
.stat-row{display:flex;gap:12px;margin-bottom:12px}
.stat-box{flex:1;text-align:center;background:var(--surface);border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow)}
</style>
</head>
<body>

<div id="loginBox">
  <h1>🏫 生活常規查詢</h1>
  <p class="subtitle">請輸入座號與查詢密碼</p>
  <div class="card">
    <div class="field">
      <label>座號</label>
      <input type="number" id="inputSeat" min="1" max="33" placeholder="01">
    </div>
    <div class="field">
      <label>查詢密碼</label>
      <input type="password" id="inputPass" maxlength="4" placeholder="••••">
    </div>
    <div id="loginErr" class="err" style="display:none"></div>
    <button class="btn" onclick="doLogin()">查詢</button>
  </div>
  <p style="font-size:12px;color:var(--text3);text-align:center">密碼由導師提供，如有疑問請聯繫班級導師</p>
</div>

<div id="resultBox" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div>
      <h1 id="stuName"></h1>
      <div class="subtitle" id="stuSeat"></div>
    </div>
    <button onclick="doLogout()" style="padding:8px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer">登出</button>
  </div>

  <!-- 本學期統計 -->
  <div class="card">
    <div class="card-title">📊 本學期累計</div>
    <div class="stat-row">
      <div class="stat-box"><div class="big-num" id="totalDeduct" style="color:var(--red)">0</div><div style="font-size:11px;color:var(--text3);margin-top:2px">累計缺點</div></div>
      <div class="stat-box"><div class="big-num" id="totalAward" style="color:var(--green)">0</div><div style="font-size:11px;color:var(--text3);margin-top:2px">嘉獎</div></div>
      <div class="stat-box"><div class="big-num" id="totalWarn" style="color:var(--amber)">0</div><div style="font-size:11px;color:var(--text3);margin-top:2px">警告</div></div>
    </div>
    <div id="remainInfo" style="font-size:12px;color:var(--text3);text-align:center"></div>
  </div>

  <!-- 常規登記明細 -->
  <div class="card">
    <div class="card-title">📋 常規登記明細</div>
    <div id="conductList"></div>
  </div>

  <!-- 優缺點明細 -->
  <div class="card">
    <div class="card-title">🏅 優缺點明細</div>
    <div id="meritList"></div>
  </div>
</div>

<script>
const NOTION_BASE = 'https://api.notion.com/v1';
// Token 嵌入（只有讀取權限）
// Token 分段儲存避免掃描誤判
const _t1='ntn_2271638544';
const _t2='04jLQDhbd4Cg';
const _t3='OJe9KXjba72S';
const _t4='vqhmwgPQVavf';
const TOKEN = _t1+_t2+_t3+_t4;
const STUDENT_DB = 'd068d447-f428-47b6-9179-a3c0de0e9db7';
const CONDUCT_DB = '0b6fdfa6-a7bf-4420-b53f-0409a297324f';
const MERIT_DB   = 'f765d727-9900-45cf-8e30-c85530e8cb47';
const MERIT_RATIO = 6;

async function notionQ(dbId, filter) {
  const resp = await fetch(`${NOTION_BASE}/databases/${dbId}/query`, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + TOKEN,
      'Notion-Version': '2022-06-28',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({filter, page_size:100})
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.message);
  return data.results;
}

async function doLogin() {
  const seat = parseInt(document.getElementById('inputSeat').value);
  const pass = document.getElementById('inputPass').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.style.display='none';

  if (!seat||seat<1||seat>33||!pass) {
    errEl.textContent='請輸入完整的座號與密碼'; errEl.style.display='block'; return;
  }

  try {
    // 查詢學生
    const results = await notionQ(STUDENT_DB, {
      and:[
        {property:'座號',number:{equals:seat}},
        {property:'密碼',rich_text:{equals:pass}}
      ]
    });

    if (!results.length) {
      errEl.textContent='座號或密碼錯誤，請確認後再試'; errEl.style.display='block'; return;
    }

    const stu = results[0];
    const name = stu.properties['姓名']?.title?.[0]?.plain_text || seat+'號';

    // 查詢常規
    const conductData = await notionQ(CONDUCT_DB, {property:'座號',number:{equals:seat}});
    // 查詢優缺點
    const meritData = await notionQ(MERIT_DB, {property:'座號',number:{equals:seat}});

    showResult(seat, name, conductData, meritData);
  } catch(e) {
    errEl.textContent='查詢失敗：'+e.message; errEl.style.display='block';
  }
}

function showResult(seat, name, conductData, meritData) {
  document.getElementById('loginBox').style.display='none';
  document.getElementById('resultBox').style.display='block';
  document.getElementById('stuName').textContent = name+' 同學';
  document.getElementById('stuSeat').textContent = '座號 '+String(seat).padStart(2,'0');

  // 常規明細（按週次分組）
  const conductEl = document.getElementById('conductList');
  if (!conductData.length) {
    conductEl.innerHTML='<div style="color:var(--text3);font-size:13px">本學期無常規登記記錄</div>';
  } else {
    const byWeek = {};
    conductData.forEach(p=>{
      const w = p.properties['週次']?.number||0;
      if(!byWeek[w]) byWeek[w]=[];
      byWeek[w].push(p);
    });
    let html='';
    Object.keys(byWeek).sort((a,b)=>b-a).forEach(w=>{
      html+=`<div style="font-size:11px;font-weight:700;color:var(--text3);margin:10px 0 4px">第 ${w} 週</div>`;
      byWeek[w].forEach(p=>{
        const item=p.properties['項目']?.rich_text?.[0]?.plain_text||'';
        const day=p.properties['星期']?.select?.name||'';
        const note=p.properties['備註']?.rich_text?.[0]?.plain_text||'';
        html+=`<div class="item-row"><span>${item}${note?` (${note})`:''}</span><span style="color:var(--text3)">週${day}</span></div>`;
      });
    });
    conductEl.innerHTML=html;
  }

  // 優缺點明細
  const meritEl = document.getElementById('meritList');
  let totalMeritNet = 0;
  let totalConductDeduct = 0;

  // 計算常規缺點（從優缺點DB中找）
  meritData.forEach(p=>{
    const score = p.properties['分數']?.number||0;
    const item = p.properties['項目']?.rich_text?.[0]?.plain_text||'';
    if (item.includes('生活常規缺點')) totalConductDeduct += Math.abs(score);
    totalMeritNet += score;
  });

  const totalNet = totalMeritNet;
  const award = totalNet>0 ? Math.floor(totalNet/MERIT_RATIO) : 0;
  const warn  = totalNet<0 ? Math.floor(Math.abs(totalNet)/MERIT_RATIO) : 0;
  const remain= Math.abs(totalNet)%MERIT_RATIO;

  document.getElementById('totalDeduct').textContent = totalConductDeduct;
  document.getElementById('totalAward').textContent = award;
  document.getElementById('totalWarn').textContent = warn;
  document.getElementById('remainInfo').textContent =
    remain>0 ? `餘數 ${remain} 支（累積至下次結算）` : '';

  if (!meritData.length) {
    meritEl.innerHTML='<div style="color:var(--text3);font-size:13px">本學期無優缺點記錄</div>';
  } else {
    let html='';
    [...meritData].sort((a,b)=>{
      const wa=a.properties['週次']?.number||0;
      const wb=b.properties['週次']?.number||0;
      return wb-wa;
    }).forEach(p=>{
      const item=p.properties['項目']?.rich_text?.[0]?.plain_text||'';
      const score=p.properties['分數']?.number||0;
      const week=p.properties['週次']?.number||'';
      const date=p.properties['日期']?.date?.start||'';
      html+=`<div class="merit-row">
        <span>${item}</span>
        <span style="display:flex;gap:8px;align-items:center">
          <span style="color:${score>0?'var(--green)':'var(--red)'};font-weight:700">${score>0?'+':''}${score}</span>
          <span style="font-size:11px;color:var(--text3)">W${week}</span>
        </span>
      </div>`;
    });
    meritEl.innerHTML=html;
  }
}

function doLogout() {
  document.getElementById('resultBox').style.display='none';
  document.getElementById('loginBox').style.display='block';
  document.getElementById('inputSeat').value='';
  document.getElementById('inputPass').value='';
}

document.getElementById('inputPass').addEventListener('keydown', e=>{
  if(e.key==='Enter') doLogin();
});
</script>
</body>
</html>
