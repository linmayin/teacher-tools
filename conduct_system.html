<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>常規表現與優缺點管理</title>
<link rel="icon" type="image/png" href="conduct_favicon.png">
<link rel="apple-touch-icon" href="conduct_favicon.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0ede8;--border:#e0dbd3;
  --text:#1a1814;--text2:#6b6560;--text3:#a09a93;
  --accent:#2d5be3;--accent-light:#edf0fd;
  --green:#1e7e4a;--green-bg:#edf7f2;
  --red:#c0392b;--red-bg:#fce8e8;
  --amber:#b45309;--amber-bg:#fef3c7;
  --purple:#6d28d9;--purple-bg:#ede9fe;
  --radius:14px;--radius-sm:8px;--shadow:0 2px 12px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:100;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:52px;padding:10px 4px 8px;font-size:11px;text-align:center;
  cursor:pointer;border:none;background:none;color:var(--text3);
  border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:500}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.section{display:none;padding:14px;padding-bottom:40px}.section.active{display:block}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:10px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-purple{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%;margin-bottom:8px}
.field{margin-bottom:10px}
.field label{font-size:12px;color:var(--text3);display:block;margin-bottom:4px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;max-width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;box-sizing:border-box}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--surface2);font-size:13px;font-weight:500;cursor:pointer;user-select:none}
.chip.sel-minus{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.chip.sel-plus{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.no-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.no-btn{padding:10px 4px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface2);cursor:pointer;text-align:center;font-size:16px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;-webkit-user-select:none}
.no-btn:active{transform:scale(0.93)}
.no-btn.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.no-btn .nb-name{font-size:11px;font-weight:500;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-item{display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px solid var(--border);gap:8px;font-size:13px}
.log-item:last-child{border-bottom:none}
.week-label{font-size:11px;font-weight:700;color:var(--text3);margin:10px 0 4px;letter-spacing:.5px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-blue{background:var(--accent-light);color:var(--accent)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.sum-table{width:100%;border-collapse:collapse;font-size:13px}
.sum-table th{font-size:11px;color:var(--text3);font-weight:600;text-align:left;
  padding:6px 8px;border-bottom:1px solid var(--border)}
.sum-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.sum-table tr:last-child td{border-bottom:none}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:var(--surface);border-radius:var(--radius-sm);padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:800;line-height:1.1}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:#1a1814;color:#fff;padding:10px 20px;border-radius:20px;
  font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.f1{flex:1;min-width:120px}
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab active" onclick="switchTab('record',this)">✏️<br>登記</button>
  <button class="tab" onclick="switchTab('log',this)">📋<br>記錄</button>
  <button class="tab" onclick="switchTab('merit',this)">🏅<br>優缺點</button>
  <button class="tab" onclick="switchTab('summary',this)">📊<br>週結算</button>
  <button class="tab" onclick="switchTab('transfer',this)">🔄<br>期末結轉</button>
  <button class="tab" onclick="switchTab('settings',this)">⚙️<br>設定</button>
</div>

<!-- 每日登記 -->
<div id="tab-record" class="section active">
  <div class="card">
    <div class="field" style="margin-bottom:10px">
      <label>登記日期</label>
      <input type="date" id="recDate">
    </div>
    <div style="display:flex;gap:8px">
      <div class="field" style="margin:0;flex:1">
        <label>星期</label>
        <select id="recDay">
          <option value="一">星期一</option><option value="二">星期二</option>
          <option value="三">星期三</option><option value="四">星期四</option>
          <option value="五">星期五</option>
        </select>
      </div>
      <div class="field" style="margin:0;width:90px">
        <label>週次</label>
        <input type="number" id="recWeek" value="1" min="1" max="52" style="text-align:center">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">選擇項目</div>
    <div class="chip-wrap" id="itemChips"></div>
    <div id="noteWrap" style="display:none;margin-top:8px">
      <label style="font-size:12px;color:var(--text3);font-weight:500">備註（如英習、數作）</label>
      <input type="text" id="noteInput" placeholder="英習、數作…">
    </div>
  </div>
  <div class="card">
    <div class="card-title">選擇座號（可多選）</div>
    <div class="no-grid" id="recGrid"></div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn btn-primary" style="flex:2" onclick="addRecord()">＋ 新增登記</button>
    <button class="btn" style="flex:1" onclick="clearRecSel()">清除選擇</button>
  </div>
  <div id="recMsg"></div>
</div>

<!-- 登記記錄 -->
<div id="tab-log" class="section">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div class="card-title" style="margin:0">登記記錄</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <select id="logWeekFilter" onchange="renderLog()" style="font-size:13px">
          <option value="">全部週次</option>
        </select>
        <select id="logDayFilter" onchange="renderLog()" style="font-size:13px">
          <option value="">全部星期</option>
          <option value="一">週一</option><option value="二">週二</option>
          <option value="三">週三</option><option value="四">週四</option>
          <option value="五">週五</option>
        </select>
        <button class="btn btn-sm btn-red" onclick="deleteWeekLogs()">🗑 刪除此週</button>
      </div>
    </div>
    <div id="logList"></div>
  </div>
  <div class="card">
    <div class="card-title">貼上 CSV 匯入</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:6px">格式：座號,項目,星期（第4欄選填備註）</div>
    <textarea id="csvPaste" style="height:100px;font-size:12px;font-family:monospace;resize:vertical" placeholder="3,作業缺交/學用品,三,英習&#10;7,服裝儀容,三"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <div style="font-size:12px;color:var(--text3)">匯入至第</div>
      <input type="number" id="csvWeek" value="1" min="1" max="52" style="width:60px">
      <div style="font-size:12px;color:var(--text3)">週</div>
      <button class="btn btn-primary btn-sm" onclick="importCSVPaste()">⬆ 匯入</button>
    </div>
    <div id="importMsg"></div>
  </div>
</div>

<!-- 優缺點 -->
<div id="tab-merit" class="section">
  <div class="card">
    <div class="card-title">新增優缺點記錄</div>
    <div class="field" style="margin-bottom:10px">
      <label>日期</label>
      <input type="date" id="meritDate">
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <div class="field" style="margin:0;flex:1">
        <label>週次</label>
        <input type="number" id="meritWeek" value="1" min="1" max="52" style="text-align:center">
      </div>
    </div>
    <div class="field" style="margin-top:10px">
      <label>類型與項目</label>
      <div class="chip-wrap" id="meritChips"></div>
    </div>
    <div class="card-title" style="margin-top:4px">選擇座號（可多選）</div>
    <div class="no-grid" id="meritGrid"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-primary" style="flex:2" onclick="addMerit()">＋ 新增</button>
      <button class="btn" style="flex:1" onclick="clearMeritSel()">清除</button>
    </div>
    <div id="meritMsg"></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">
      <div class="card-title" style="margin:0">優缺點記錄</div>
      <button class="btn btn-sm btn-red" onclick="clearAllMerits()">🗑 清除全部</button>
    </div>
    <div id="meritList"></div>
  </div>
  <div class="card">
    <div class="card-title">自訂優缺點項目</div>
    <div id="customMeritList" style="margin-bottom:8px"></div>
    <div style="display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:2;min-width:90px">
        <label style="font-size:12px;color:var(--text3);font-weight:500;display:block;margin-bottom:4px">項目名稱</label>
        <input type="text" id="newMeritName" placeholder="例：榮譽班">
      </div>
      <div style="width:70px">
        <label style="font-size:12px;color:var(--text3);font-weight:500;display:block;margin-bottom:4px">分數</label>
        <input type="number" id="newMeritScore" value="1" step="1" style="text-align:center">
      </div>
      <button class="btn btn-primary btn-sm" onclick="addCustomMerit()" style="height:42px">＋ 新增</button>
    </div>
  </div>
</div>

<!-- 週結算 -->
<div id="tab-summary" class="section">
  <div class="card">
    <div class="card-title">週結算</div>
    <div class="row">
      <div class="field f1" style="margin:0">
        <label>選擇結算週次</label>
        <select id="sumWeekSel" onchange="summaryData=null;document.getElementById('summaryContent').innerHTML=''">
          <option value="">請選擇週次</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="calcSummary()" style="height:44px">↻ 計算統計</button>
    </div>
  </div>
  <div id="summaryContent"></div>
  <div id="summaryActions" style="display:none">
    <div class="card">
      <div class="card-title">匯出</div>
      <button class="btn btn-full" onclick="exportWeeklyText()">⬇ 匯出週報純文字（寄家長用）</button>
      <button class="btn btn-full" onclick="exportWeeklyCSV()">⬇ 匯出本週常規明細 CSV</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">常規表現總表</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:8px">匯出所有週次的常規登記統計</div>
    <button class="btn btn-full" onclick="exportAllConductCSV()">⬇ 匯出常規表現總表 CSV</button>
  </div>
</div>

<!-- 期末結轉 -->
<div id="tab-transfer" class="section">
  <div class="card">
    <div class="card-title">優缺點統計</div>
    <button class="btn btn-full" onclick="calcMeritSummary()">↻ 計算優缺點統計</button>
    <div id="meritSummaryContent"></div>
  </div>
  <div id="meritSummaryActions" style="display:none">
    <div class="card">
      <div class="card-title">匯出</div>
      <button class="btn btn-full" onclick="exportMeritText()">⬇ 匯出純文字備案（寄家長用）</button>
      <button class="btn btn-full" onclick="exportMeritCSV()">⬇ 匯出優缺點統計總表 CSV</button>
    </div>
    <div class="card" style="border:2px solid var(--red)">
      <div class="card-title" style="color:var(--red)">⚠️ 期中／期末結轉</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.7">
        結轉將自動執行：<br>
        ① 匯出純文字備案<br>
        ② 匯出優缺點統計總表 CSV<br>
        ③ 清除所有優缺點記錄<br>
        ④ 將各生餘數存回（結轉當天日期）
      </div>
      <button class="btn btn-red btn-full" onclick="doTransfer()">🔄 執行結轉</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div id="tab-settings" class="section">
  <div class="card">
    <div class="card-title">週次設定</div>
    <div class="row">
      <div class="field f1" style="margin:0">
        <label>目前週次</label>
        <input type="number" id="weekNum" value="1" min="1" max="52" onchange="saveSettings()">
      </div>
      <div class="field f1" style="margin:0">
        <label>週一日期</label>
        <input type="date" id="weekStart" onchange="autoWeekRange()">
      </div>
    </div>
    <div class="field" style="margin-top:10px">
      <label>日期範圍（自動產生）</label>
      <input type="text" id="weekRange" readonly style="background:var(--surface2);color:var(--text2)">
    </div>
    <button class="btn btn-primary btn-sm" onclick="applyCurrentWeek()">套用至登記頁</button>
  </div>
  <div class="card">
    <div class="card-title">學生名單</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:8px">Excel 格式：第一欄座號、第二欄姓名</div>
    <label class="btn btn-full" style="cursor:pointer;justify-content:center">
      📊 匯入 Excel 或 CSV 名單
      <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importRoster(this)">
    </label>
    <div id="rosterPreview" style="font-size:12px;color:var(--text3);margin-top:6px"></div>
  </div>
  <div class="card">
    <div class="card-title">資料管理</div>
    <button class="btn btn-full" onclick="deleteWeekLogsFromSettings()">🗑 刪除指定週次常規登記</button>
    <button class="btn btn-full btn-red" onclick="clearAllData()">⚠️ 清除全部資料</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
// ===== 常數 =====
const TOTAL=33;
const DATA_KEY='cs2_data_v1';
const CONDUCT_ITEMS=[
  {key:'遲到', label:'上學遲到',        noDeduct:true},
  {key:'晚進', label:'上課晚進',         noDeduct:false},
  {key:'秩序', label:'秩序表現',         noDeduct:false},
  {key:'趴睡', label:'上課趴睡',         noDeduct:false},
  {key:'聯絡本',label:'聯絡本缺遲',      noDeduct:false},
  {key:'作業', label:'作業缺交/學用品',  noDeduct:false, hasNote:true},
  {key:'打掃', label:'打掃工作',         noDeduct:false},
  {key:'環境', label:'環境與桌椅',       noDeduct:false},
  {key:'服儀', label:'服裝儀容',         noDeduct:true}
];
const OUT_LABELS={
  '遲到':'上學遲到','晚進':'上課晚進','秩序':'影響秩序','趴睡':'上課趴睡',
  '聯絡本':'聯絡本缺遲','作業':'作業缺交/學用品未帶','打掃':'打掃未完成',
  '環境':'環境（桌面未清空、椅子未靠、環境清潔待改善）','服儀':'服裝儀容待改善'
};
const DAYS=['一','二','三','四','五'];
const MERIT_RATIO=6;
const DEFAULT_MERIT_ITEMS=[
  {name:'榮譽班',score:1},{name:'主動回答',score:1},{name:'表現優異',score:1},
  {name:'功課未交',score:-1},{name:'上課講話',score:-1},{name:'上課睡覺',score:-1}
];

// ===== 狀態 =====
let state={
  students:[],
  logs:[],      // [{no,item,day,note,date,week}]
  merits:[],    // [{no,item,score,date,week}]
  customMerits:[],
  weekNum:1, weekStart:'', weekRange:'', notionToken:''
};
let selItem=null, selNos=new Set();
let meritItem=null, meritScore=0, meritNos=new Set();
let summaryData=null, meritSummaryData=null;

// ===== 初始化 =====
function init(){
  loadState();
  setTodayDate();
  renderItemChips();
  renderNoGrid('recGrid',selNos,toggleRecNo);
  renderMeritChips();
  renderNoGrid('meritGrid',meritNos,toggleMeritNo);
  renderLog();
  renderMeritList();
  renderCustomMeritList();
  updateWeekSelectors();
  document.getElementById('weekNum').value=state.weekNum;
  document.getElementById('weekStart').value=state.weekStart;
  document.getElementById('weekRange').value=state.weekRange;
  document.getElementById('recWeek').value=state.weekNum;
  document.getElementById('meritWeek').value=state.weekNum;
  document.getElementById('csvWeek').value=state.weekNum;
  updateRosterPreview();
}

function loadState(){
  try{const d=localStorage.getItem(DATA_KEY);if(d)Object.assign(state,JSON.parse(d));}catch(e){}
}
function saveState(){
  try{localStorage.setItem(DATA_KEY,JSON.stringify(state));}catch(e){}
}

function setTodayDate(){
  const today=new Date();
  const dateStr=today.toLocaleDateString('sv');
  document.getElementById('recDate').value=dateStr;
  document.getElementById('meritDate').value=dateStr;
  const dayMap={1:'一',2:'二',3:'三',4:'四',5:'五'};
  if(dayMap[today.getDay()]) document.getElementById('recDay').value=dayMap[today.getDay()];
}

function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='log'){renderLog();updateWeekSelectors();}
  if(name==='merit'){renderMeritList();renderCustomMeritList();}
  if(name==='summary'){updateWeekSelectors();}
}

// ===== 週次選單 =====
function updateWeekSelectors(){
  const weeks=[...new Set(state.logs.map(l=>l.week))].sort((a,b)=>a-b);
  ['logWeekFilter','sumWeekSel'].forEach(id=>{
    const sel=document.getElementById(id);
    if(!sel)return;
    const curVal=sel.value;
    sel.innerHTML=id==='logWeekFilter'?'<option value="">全部週次</option>':'<option value="">請選擇週次</option>';
    weeks.forEach(w=>{
      const o=document.createElement('option');
      o.value=w; o.textContent='第 '+w+' 週';
      sel.appendChild(o);
    });
    if(curVal) sel.value=curVal;
  });
}

// ===== 座號格子 =====
function renderNoGrid(gridId,selSet,toggleFn){
  const g=document.getElementById(gridId); g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){
    const s=state.students.find(x=>x.no===i);
    const btn=document.createElement('button');
    btn.className='no-btn'+(selSet.has(i)?' sel':'');
    btn.innerHTML=`<span>${String(i).padStart(2,'0')}</span>${s?`<span class="nb-name">${s.name}</span>`:''}`;
    btn.onclick=()=>toggleFn(i);
    g.appendChild(btn);
  }
}

function toggleRecNo(no){
  if(selNos.has(no))selNos.delete(no);else selNos.add(no);
  document.querySelectorAll('#recGrid .no-btn').forEach((b,i)=>{
    b.className='no-btn'+(selNos.has(i+1)?' sel':'');
  });
}
function toggleMeritNo(no){
  if(meritNos.has(no))meritNos.delete(no);else meritNos.add(no);
  document.querySelectorAll('#meritGrid .no-btn').forEach((b,i)=>{
    b.className='no-btn'+(meritNos.has(i+1)?' sel':'');
  });
}

// ===== 常規項目 chip =====
function renderItemChips(){
  const wrap=document.getElementById('itemChips'); wrap.innerHTML='';
  CONDUCT_ITEMS.forEach(it=>{
    const div=document.createElement('div');
    const isSel=selItem===it.key;
    div.className='chip'+(isSel?(it.noDeduct?' sel-plus':' sel-minus'):'');
    div.innerHTML=it.label+(it.noDeduct?' <small style="opacity:.6;font-size:10px">僅登記</small>':'');
    div.onclick=()=>{
      selItem=selItem===it.key?null:it.key;
      document.getElementById('noteWrap').style.display=(selItem&&CONDUCT_ITEMS.find(x=>x.key===selItem)?.hasNote)?'block':'none';
      renderItemChips();
    };
    wrap.appendChild(div);
  });
}

function addRecord(){
  const msg=document.getElementById('recMsg');
  if(!selItem){showMsg(msg,'請先選擇項目','red');return;}
  if(selNos.size===0){showMsg(msg,'請選擇至少一個座號','red');return;}
  const day=document.getElementById('recDay').value;
  const date=document.getElementById('recDate').value;
  const week=parseInt(document.getElementById('recWeek').value)||state.weekNum;
  const note=document.getElementById('noteInput').value.trim();
  selNos.forEach(no=>{
    state.logs.push({no,item:selItem,day,date,week,
      note:CONDUCT_ITEMS.find(x=>x.key===selItem)?.hasNote?note:''});
  });
  const cnt=selNos.size;
  const label=CONDUCT_ITEMS.find(x=>x.key===selItem)?.label;
  selNos.clear(); document.getElementById('noteInput').value='';
  renderItemChips(); renderNoGrid('recGrid',selNos,toggleRecNo);
  saveState(); updateWeekSelectors();
  showMsg(msg,`已新增 ${cnt} 筆（第${week}週・週${day}・${label}）`,'green');
}

function clearRecSel(){
  selItem=null;selNos.clear();
  document.getElementById('noteInput').value='';
  document.getElementById('noteWrap').style.display='none';
  renderItemChips(); renderNoGrid('recGrid',selNos,toggleRecNo);
}

// ===== 登記記錄 =====
function renderLog(){
  const weekFilter=document.getElementById('logWeekFilter')?.value||'';
  const dayFilter=document.getElementById('logDayFilter')?.value||'';
  const list=document.getElementById('logList');
  let filtered=state.logs.filter(l=>(!weekFilter||l.week==weekFilter)&&(!dayFilter||l.day===dayFilter));
  if(!filtered.length){list.innerHTML='<div style="color:var(--text3);font-size:13px;padding:8px 0">尚無登記記錄</div>';return;}
  // 依週次+星期分組
  const grouped={};
  filtered.forEach(l=>{
    const key='第'+l.week+'週・週'+l.day;
    if(!grouped[key])grouped[key]=[];
    grouped[key].push({...l,idx:state.logs.indexOf(l)});
  });
  let html='';
  Object.keys(grouped).sort().forEach(k=>{
    html+=`<div class="week-label">${k}</div>`;
    grouped[k].forEach(l=>{
      const it=CONDUCT_ITEMS.find(x=>x.key===l.item);
      const s=state.students.find(x=>x.no===l.no);
      html+=`<div class="log-item">
        <span><b>${l.no}${s?' '+s.name:''}</b> — ${it?.label||l.item}${l.note?` <span style="color:var(--accent);font-size:12px">${l.note}</span>`:''}${it?.noDeduct?' <span style="font-size:11px;color:var(--text3)">僅登記</span>':''}</span>
        <button class="btn btn-sm btn-red" onclick="deleteLog(${l.idx})" style="flex-shrink:0;padding:4px 8px">🗑</button>
      </div>`;
    });
  });
  list.innerHTML=html;
}

function deleteLog(idx){state.logs.splice(idx,1);saveState();renderLog();}

function deleteWeekLogs(){
  const w=document.getElementById('logWeekFilter').value;
  if(!w){showToast('請先選擇週次');return;}
  if(!confirm(`確定刪除第 ${w} 週所有常規登記？`))return;
  state.logs=state.logs.filter(l=>l.week!=w);
  saveState();updateWeekSelectors();renderLog();
}

function importCSVPaste(){
  const text=document.getElementById('csvPaste').value.trim();
  const msgEl=document.getElementById('importMsg');
  const week=parseInt(document.getElementById('csvWeek').value)||state.weekNum;
  if(!text){msgEl.innerHTML='<div style="color:var(--red);font-size:12px;margin-top:4px">請先貼上內容</div>';return;}
  let count=0;
  text.split('\n').forEach(l=>{
    l=l.trim();if(!l)return;
    const parts=l.split(',');
    if(parts.length<3)return;
    const no=parseInt(parts[0]);
    const itemLabel=parts[1].trim();
    const day=parts[2].trim();
    const note=parts[3]?parts[3].trim():'';
    if(isNaN(no)||no<1||no>TOTAL||!DAYS.includes(day))return;
    if(itemLabel==='項目')return;
    const it=CONDUCT_ITEMS.find(x=>x.label===itemLabel||itemLabel.includes(x.key)||x.label.includes(itemLabel));
    if(it){state.logs.push({no,item:it.key,day,date:'',week,note:it.hasNote?note:''});count++;}
  });
  document.getElementById('csvPaste').value='';
  msgEl.innerHTML=`<div style="color:var(--green);font-size:12px;margin-top:4px">已匯入 ${count} 筆（第${week}週）</div>`;
  setTimeout(()=>msgEl.innerHTML='',3000);
  saveState();updateWeekSelectors();renderLog();
}

}

// ===== 週結算計算 =====
function calcWeekly(week){
  const counts={};
  for(let i=1;i<=TOTAL;i++){
    counts[i]={};
    CONDUCT_ITEMS.forEach(it=>{counts[i][it.key]={count:0,notes:[],days:[]};});
  }
  state.logs.filter(l=>l.week==week).forEach(l=>{
    if(counts[l.no]&&counts[l.no][l.item]){
      counts[l.no][l.item].count++;
      counts[l.no][l.item].days.push(l.day);
      if(l.note&&!counts[l.no][l.item].notes.includes(l.note))counts[l.no][l.item].notes.push(l.note);
    }
  });
  return Array.from({length:TOTAL},(_,i)=>{
    const s=state.students.find(x=>x.no===i+1);
    let totalDeduct=0,recordDetails=[];
    CONDUCT_ITEMS.forEach(it=>{
      const c=counts[i+1][it.key];
      if(c.count>0){
        recordDetails.push({label:it.label,outLabel:OUT_LABELS[it.key]||it.label,key:it.key,
          count:c.count,notes:c.notes,days:[...new Set(c.days)],noDeduct:it.noDeduct});
        if(!it.noDeduct&&c.count>=3)totalDeduct+=Math.floor(c.count/3);
      }
    });
    const level=recordDetails.length===0&&totalDeduct===0?'優異':totalDeduct===0?'不錯':'加強';
    return {no:i+1,name:s?.name||'',level,totalDeduct,recordDetails};
  });
}

function calcSummary(){
  const week=document.getElementById('sumWeekSel').value;
  if(!week){showToast('請選擇週次');return;}
  summaryData=calcWeekly(week);
  const good=summaryData.filter(x=>x.level==='優異').length;
  const ok=summaryData.filter(x=>x.level==='不錯').length;
  const warn=summaryData.filter(x=>x.level==='加強').length;
  const labelMap={'優異':'表現優異','不錯':'表現不錯','加強':'尚待努力'};
  const badgeMap={'優異':'badge-green','不錯':'badge-blue','加強':'badge-red'};
  let html=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${good}</div><div class="stat-label">表現優異</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--accent)">${ok}</div><div class="stat-label">表現不錯</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${warn}</div><div class="stat-label">尚待努力</div></div>
  </div>
  <div class="card"><div class="card-title">第 ${week} 週明細</div>
  <div style="overflow-x:auto"><table class="sum-table">
  <thead><tr><th>號</th><th>姓名</th><th>評等</th><th>缺點</th><th>常規明細</th></tr></thead><tbody>`;
  summaryData.forEach(s=>{
    const det=s.recordDetails.map(d=>{
      const noteTags=d.notes.map(n=>`<span style="color:var(--accent);font-size:11px">${n}</span>`).join('');
      return `<div style="font-size:11px;margin:1px 0">${d.label}×${d.count}（週${d.days.join('、')}）${noteTags}</div>`;
    }).join('')||'<span style="color:var(--text3);font-size:11px">無</span>';
    html+=`<tr><td>${s.no}</td><td style="white-space:nowrap">${s.name||'—'}</td>
      <td><span class="badge ${badgeMap[s.level]}">${labelMap[s.level]}</span></td>
      <td style="text-align:center">${s.totalDeduct>0?s.totalDeduct+'支':'—'}</td>
      <td>${det}</td></tr>`;
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('summaryContent').innerHTML=html;
  document.getElementById('summaryActions').style.display='block';
}

function exportAllConductCSV(){
  let csv='\uFEFF週次,座號,姓名,項目,次數,星期,備註\n';
  const weeks=[...new Set(state.logs.map(l=>l.week))].sort((a,b)=>a-b);
  weeks.forEach(week=>{
    const data=calcWeekly(week);
    data.forEach(s=>{
      s.recordDetails.forEach(d=>{
        csv+=`${week},${s.no},"${s.name}","${d.label}",${d.count},"${d.days.join('、')}","${d.notes.join('、')}"\n`;
      });
    });
  });
  dlFile('常規表現總表.csv',csv,'text/csv');
  showToast('常規表現總表已匯出');
}

// ===== 優缺點結算 =====
function calcMeritForStudent(no){
  const sub=state.merits.filter(m=>m.no===no);
  const net=sub.reduce((s,m)=>s+m.score,0);
  let award=0,warn=0,remain=0,remainType='';
  if(net>0){award=Math.floor(net/MERIT_RATIO);remain=net%MERIT_RATIO;remainType=remain>0?'優點':'';}
  else if(net<0){const absNet=Math.abs(net);warn=Math.floor(absNet/MERIT_RATIO);remain=absNet%MERIT_RATIO;remainType=remain>0?'缺點':'';}
  return{net,award,warn,remain,remainType,records:sub};
}

  meritSummaryData.forEach(s=>{
    const remainStr=s.remain>0?(s.remainType==='優點'?'+':'-')+s.remain+'支'+s.remainType:'—';
    html+=`<tr>
      <td>${s.no}</td><td>${s.name||'—'}</td>

      if(s.award>0||s.remain>0)body+='\n';
    }else if(s.net<0){
      body+=`優缺點互抵後尚有缺點 ${Math.abs(s.net)} 支。\n`;
      if(s.warn>0)body+=`記警告 ${s.warn} 支；`;
      if(s.remain>0)body+=`餘數 ${s.remain} 支缺點（累積至下次結算）`;
      if(s.warn>0||s.remain>0)body+='\n';
    }else{body+='優缺點互抵後結餘為零。\n';}
    body+='\n說明：\n- 品德卡一學期統計兩次，期中期末各一次。\n- +代表優點；-代表缺點\n- 累積六支優點可記一支嘉獎；反之亦然。\n- 警告可至學務處申請後做愛校服務銷除。\n\n導師 林美吟 敬上';
    txt+=`【${noStr} ${s.name}】${s.email?' Email: '+s.email:'（無 Email）'}\n主旨：${subject}\n${body}\n${'-'.repeat(30)}\n\n`;
  });
  dlFile('品德卡優缺點結算通知備案_'+new Date().toLocaleDateString('sv')+'.txt',txt,'text/plain');
  showToast('純文字備案已匯出');
}

function exportMeritCSV(){
  if(!meritSummaryData){showToast('請先計算統計');return;}
  let csv='\uFEFF座號,姓名,優點合計,缺點合計,淨值,嘉獎,警告,餘數,餘數類型\n';
  meritSummaryData.forEach(s=>{
    const plus=s.records.filter(r=>r.score>0).reduce((a,r)=>a+r.score,0);
    const minus=Math.abs(s.records.filter(r=>r.score<0).reduce((a,r)=>a+r.score,0));
    csv+=`${s.no},"${s.name}",${plus},${minus},${s.net},${s.award},${s.warn},${s.remain},"${s.remainType}"\n`;
  });
  dlFile('優缺點統計總表_'+new Date().toLocaleDateString('sv')+'.csv',csv,'text/csv');
  showToast('優缺點統計總表已匯出');
}

// ===== 期末結轉 =====
async function doTransfer(){
  if(!meritSummaryData){showToast('請先計算統計');return;}
  if(!confirm('確定執行結轉？\n\n① 匯出純文字備案\n② 匯出統計總表 CSV\n③ 清除所有優缺點記錄\n④ 存入各生餘數\n\n請確認已允許下載。'))return;
  exportMeritText();
  await new Promise(r=>setTimeout(r,800));
  exportMeritCSV();
  await new Promise(r=>setTimeout(r,800));
  const today=new Date().toLocaleDateString('sv');
  state.merits=[];
  meritSummaryData.forEach(s=>{
    if(s.remain>0){
      const score=s.remainType==='優點'?s.remain:-s.remain;
      state.merits.push({no:s.no,item:'結轉餘數',score,date:today,week:state.weekNum});
    }
  });
  meritSummaryData=null;
  document.getElementById('meritSummaryContent').innerHTML='';
  document.getElementById('meritSummaryActions').style.display='none';
  saveState();renderMeritList();
  showToast('結轉完成！');
}

// ===== 名單匯入 =====
function importRoster(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const students=[];
      rows.forEach((row,idx)=>{
        if(!row||!row.length)return;
        if(String(row[0]).trim()==='座號')return;
        const no=parseInt(row[0]);
        const name=String(row[1]||'').trim();
        const email=String(row[2]||'').trim();
        if(name)students.push({no:isNaN(no)?idx+1:no,name,email});
      });
      // 合併保留舊資料
      students.forEach(s=>{
        const ex=state.students.find(x=>x.no===s.no);
        if(ex){ex.name=s.name;if(s.email)ex.email=s.email;}
        else state.students.push(s);
      });
      saveState();updateRosterPreview();
      renderNoGrid('recGrid',selNos,toggleRecNo);
      renderNoGrid('meritGrid',meritNos,toggleMeritNo);
      showToast(`已匯入 ${students.length} 位學生`);
    }catch(e){showToast('匯入失敗：'+e.message);}
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}

function updateRosterPreview(){
  const el=document.getElementById('rosterPreview');
  const cnt=state.students.filter(s=>s.name).length;
  const emailCnt=state.students.filter(s=>s.email).length;
  el.textContent=cnt>0?`已匯入 ${cnt} 位學生，${emailCnt} 位有 Email`:'尚未匯入名單';
}

// ===== 設定 =====
function autoWeekRange(){
  const val=document.getElementById('weekStart').value;if(!val)return;
  const mon=new Date(val);const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
  const range=`${fmt(mon)}（一）－${fmt(fri)}（五）`;
  document.getElementById('weekRange').value=range;
  state.weekStart=val;state.weekRange=range;saveSettings();
}

function saveSettings(){
  state.weekNum=parseInt(document.getElementById('weekNum').value)||1;
  state.weekStart=document.getElementById('weekStart').value;
  state.weekRange=document.getElementById('weekRange').value;
  saveState();
}

function applyCurrentWeek(){
  const w=parseInt(document.getElementById('weekNum').value)||1;
  state.weekNum=w;
  document.getElementById('recWeek').value=w;
  document.getElementById('meritWeek').value=w;
  document.getElementById('csvWeek').value=w;
  saveState();showToast('已套用至登記頁');
}

function deleteWeekLogsFromSettings(){
  const w=prompt('請輸入要刪除的週次（數字）：');
  if(!w||isNaN(parseInt(w)))return;
  const week=parseInt(w);
  const cnt=state.logs.filter(l=>l.week===week).length;
  if(!confirm(`確定刪除第 ${week} 週的 ${cnt} 筆常規登記？`))return;
  state.logs=state.logs.filter(l=>l.week!==week);
  saveState();updateWeekSelectors();renderLog();
  showToast(`第 ${week} 週登記已刪除`);
}

function clearAllData(){
  if(!confirm('⚠️ 確定清除全部資料？此動作無法復原！'))return;
  state.logs=[];state.merits=[];state.students=[];state.customMerits=[];
  saveState();init();showToast('全部資料已清除');
}

// ===== 工具 =====
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show';
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2500);
}
function showMsg(el,text,color){
  el.innerHTML=`<div style="color:var(--${color});font-size:13px;margin-top:6px">${text}</div>`;
  setTimeout(()=>el.innerHTML='',2500);
}
function dlFile(name,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
}

init();
</script>
