<title>社團選填檢查器</title>
<link rel="icon" type="image/png" href="club_favicon.png">
<link rel="apple-touch-icon" href="club_favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" />
<style>
  :root {
    --bg: #f3f5f9;
    --surface: #ffffff;
    --surface-alt: #eaedf4;
    --border: #d9dfea;
    --border-strong: #c2cade;
    --ink: #1b2233;
    --ink-muted: #5b6478;
    --ink-faint: #8790a3;
    --accent: #2f5d8a;
    --accent-strong: #1f4266;
    --accent-bg: #e6eef6;
    --special: #9a3b3b;
    --special-bg: #f7e9e9;
    --success: #2e7d4f;
    --success-bg: #e4f3ea;
    --warning: #b4740e;
    --warning-bg: #fbf0dd;
    --danger: #b23b3b;
    --danger-bg: #fbeaea;
    --shadow: 0 1px 2px rgba(27, 34, 51, 0.06), 0 8px 24px -12px rgba(27, 34, 51, 0.18);
    --font-display: "Noto Serif TC", "PMingLiU", serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141c; --surface: #1a1f2b; --surface-alt: #222838; --border: #333c52; --border-strong: #46516c;
      --ink: #e7eaf2; --ink-muted: #9aa3ba; --ink-faint: #6d768c;
      --accent: #7fb0e0; --accent-strong: #a4c8ea; --accent-bg: #1f2e40;
      --special: #e2938f; --special-bg: #3a2626;
      --success: #7fce9f; --success-bg: #1e3327;
      --warning: #e3bb6a; --warning-bg: #3a2e14;
      --danger: #e2938f; --danger-bg: #3a2323;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141c; --surface: #1a1f2b; --surface-alt: #222838; --border: #333c52; --border-strong: #46516c;
    --ink: #e7eaf2; --ink-muted: #9aa3ba; --ink-faint: #6d768c;
    --accent: #7fb0e0; --accent-strong: #a4c8ea; --accent-bg: #1f2e40;
    --special: #e2938f; --special-bg: #3a2626;
    --success: #7fce9f; --success-bg: #1e3327;
    --warning: #e3bb6a; --warning-bg: #3a2e14;
    --danger: #e2938f; --danger-bg: #3a2323;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  /* The live draw+fill screen always stays pure white/ink regardless of theme —
     it is projected on a classroom screen and must read clearly under room lights. */
  .stage-white { --bg: #ffffff; --surface: #ffffff; --surface-alt: #f4f6fa; --border: #dde3ee; --border-strong: #c7d0e2; --ink: #171c28; --ink-muted: #56607a; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  #app { max-width: 1280px; margin: 0 auto; padding: 20px 20px 64px; }
  a { color: var(--accent); }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  ::selection { background: var(--accent-bg); }

  .header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px 4px 16px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .header h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
  .header .subtitle { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }
  .save-indicator { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-muted); padding: 6px 12px; border-radius: 999px; background: var(--surface-alt); border: 1px solid var(--border); white-space: nowrap; }
  .save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .save-indicator[data-state="saved"] .save-dot { background: var(--success); }
  .save-indicator[data-state="saving"] .save-dot { background: var(--warning); animation: pulse 1s ease-in-out infinite; }
  .save-indicator[data-state="pending"] .save-dot { background: var(--warning); }
  .save-indicator[data-state="error"] .save-dot, .save-indicator[data-state="unavailable"] .save-dot, .save-indicator[data-state="readonly"] .save-dot { background: var(--danger); }
  .save-indicator[data-state="localonly"] .save-dot { background: var(--warning); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .status-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .status-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .status-card .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 22px; line-height: 1.1; }
  .status-card .label { color: var(--ink-muted); font-size: 12.5px; margin-top: 3px; }
  .status-card.ok .num { color: var(--success); }
  .status-card.warn .num { color: var(--warning); }
  .status-card.bad .num { color: var(--danger); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; overflow-x: auto; }
  .tab-btn { appearance: none; background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 14px; font-size: 14.5px; font-weight: 500; color: var(--ink-muted); cursor: pointer; white-space: nowrap; }
  @media (hover: hover) { .tab-btn:hover { color: var(--ink); } }
  .tab-btn[aria-selected="true"] { color: var(--accent-strong); border-bottom-color: var(--accent); font-weight: 700; }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 4px; }
  .card .hint { color: var(--ink-muted); font-size: 13px; margin: 0 0 14px; }

  .field-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .field-row label { font-weight: 500; font-size: 14px; }
  input[type="number"], input[type="text"], select { background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 10px; color: var(--ink); }
  input[type="number"] { width: 90px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13.5px; vertical-align: middle; }
  thead th { background: var(--surface-alt); color: var(--ink-muted); font-weight: 600; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; position: sticky; top: 0; }
  tbody tr:last-child td { border-bottom: none; }
  @media (hover: hover) { tbody tr:hover { background: var(--surface-alt); } }
  td.seat, th.seat { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; width: 56px; }

  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
  .tag.special { background: var(--special-bg); color: var(--special); }
  .tag.general { background: var(--surface-alt); color: var(--ink-muted); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .pill.ok { background: var(--success-bg); color: var(--success); }
  .pill.warn { background: var(--warning-bg); color: var(--warning); }
  .pill.bad { background: var(--danger-bg); color: var(--danger); }
  .pill.neutral { background: var(--surface-alt); color: var(--ink-muted); }

  .btn { appearance: none; cursor: pointer; touch-action: manipulation; border-radius: 8px; font-weight: 600; font-size: 13.5px; padding: 8px 14px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.small { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  @media (hover: hover) {
    .btn:hover { background: var(--surface-alt); }
    .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn.danger:hover { background: var(--danger-bg); }
    .btn.ghost:hover { background: var(--surface-alt); }
  }

  textarea { width: 100%; min-height: 110px; resize: vertical; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 12px; line-height: 1.55; font-family: var(--font-mono); font-size: 13px; }

  .note { font-size: 12.5px; color: var(--ink-muted); margin-top: 6px; }
  .warn-text { color: var(--warning); font-size: 12.5px; margin-top: 4px; }
  .empty-state { color: var(--ink-faint); font-style: normal; padding: 18px 0; text-align: center; font-size: 13.5px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

  .club-manage-row { display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .club-manage-row:last-child { border-bottom: none; }
  .club-manage-row .idx { font-family: var(--font-mono); color: var(--ink-faint); font-size: 12.5px; }
  .club-manage-row input[type="text"] { width: 100%; }

  .review-club-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .review-club-line:last-child { border-bottom: none; }
  .review-club-line .name { font-weight: 500; }
  .review-club-line .who { color: var(--ink-muted); font-size: 12.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .footer-note { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 28px; }

  /* ---- live draw + fill stage ---- */
  .stage-white { border-radius: 18px; border: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px; }
  .split-grid { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(420px, 1.4fr); gap: 22px; align-items: start; }
  @media (max-width: 880px) { .split-grid { grid-template-columns: 1fr; } }
  @media (min-width: 881px) {
    /* Keep the lottery side fixed in place; only the club list on the right scrolls. */
    .split-grid > .lot-col:first-child { position: sticky; top: 12px; }
    .pick-scroll { max-height: calc(100vh - 300px); min-height: 320px; overflow-y: auto; }
  }

  .round-banner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; background: var(--accent-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; }
  .round-banner .round-title { font-weight: 700; color: var(--accent-strong); font-size: 15px; }
  .round-banner .round-rule { color: var(--ink-muted); font-size: 12.5px; }

  .lot-col h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 14px; text-align: center; }
  .lot-display { text-align: center; padding: 18px 8px 10px; border: 1px dashed var(--border-strong); border-radius: 16px; margin-bottom: 16px; }
  .lot-label { font-size: 13px; color: var(--ink-muted); letter-spacing: 0.08em; margin-bottom: 6px; }
  .lot-number { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; font-size: clamp(64px, 11vw, 148px); line-height: 1; color: var(--accent-strong); min-height: 1.1em; }
  .lot-number.empty { color: var(--ink-faint); font-size: clamp(36px, 6vw, 56px); }
  .lot-number.rolling { color: var(--ink-muted); }
  .lot-stats { font-size: 15px; color: var(--ink-muted); margin-top: 8px; }
  .lot-stats b { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .lot-btn-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .lot-btn-row .btn { flex: 1; padding: 18px 10px; font-size: 18px; border-radius: 14px; }
  .lot-overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
  .lot-cell { padding: 10px 4px; border-radius: 8px; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; border: 1.5px solid var(--border-strong); background: var(--surface-alt); color: var(--ink-muted); }
  .lot-cell.drawn { background: var(--surface); color: var(--ink-faint); border-color: var(--border); text-decoration: line-through; }
  .lot-cell.current { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-bg); }

  .pick-banner { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; font-size: 16px; font-weight: 600; text-align: center; }
  .pick-banner .seat-badge { font-family: var(--font-mono); color: var(--accent-strong); font-size: 22px; }
  .ui-message { background: var(--danger-bg); color: var(--danger); border-radius: 10px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; margin-bottom: 12px; }

  .pick-table { table-layout: fixed; }
  .pick-table th, .pick-table td { font-size: 15px; padding: 7px 10px; }
  .pick-table input[type="text"] { width: 100%; }
  .pick-table .must-input { width: 100% !important; max-width: 84px; font-family: var(--font-mono); text-align: center; }
  .pick-table td.name-cell { font-weight: 600; line-height: 1.3; }

  .slot-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .slot-input { width: 46px !important; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; padding: 7px 4px !important; }
  .slot-input.filled { border-color: var(--accent); background: var(--accent-bg); font-weight: 700; }

  .all-rounds-toggle { margin-bottom: 14px; }
  .rounds-table { width: 100%; border-collapse: collapse; }
  .rounds-table th, .rounds-table td { font-size: 14px; padding: 6px 10px; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--border); }
  .rounds-table th { background: var(--surface-alt); font-family: inherit; font-variant-numeric: normal; position: sticky; top: 0; }
  .rounds-table td.seat { color: var(--ink-faint); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) { .save-indicator[data-state="saving"] .save-dot { animation: none; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script>
(function () {
  "use strict";

  var STORAGE_PATH = "data/state.json";
  var LOCAL_KEY = "clubSignup:v1:state";

  var DEFAULT_CLUBS = [
    { id: 1, name: "國樂團", special: true },
    { id: 2, name: "合唱團", special: true },
    { id: 3, name: "弦樂團", special: true },
    { id: 4, name: "管樂團", special: true },
    { id: 5, name: "童軍團", special: true },
    { id: 6, name: "BBC巧福社", special: true },
    { id: 7, name: "日本文化與語言社", special: true },
    { id: 8, name: "創意數理研究社", special: true },
    { id: 9, name: "美術藝能社", special: true },
    { id: 10, name: "籃球社", special: true },
    { id: 11, name: "桌球社", special: false },
    { id: 12, name: "羽球社", special: false },
    { id: 13, name: "匹克球社", special: false },
    { id: 14, name: "樂樂棒球社", special: false },
    { id: 15, name: "健康促進社", special: false },
    { id: 16, name: "環保服務社", special: false },
    { id: 17, name: "熱舞社", special: false },
    { id: 18, name: "電影欣賞社", special: false },
    { id: 19, name: "文藝欣賞社", special: false },
    { id: 20, name: "西洋流行歌曲欣賞研究社", special: false },
    { id: 21, name: "家政社", special: false },
    { id: 22, name: "紙雕創作社", special: false },
    { id: 23, name: "吉麗熱音社", special: false },
    { id: 24, name: "造型氣球社", special: false },
    { id: 25, name: "麵包花與捏塑創意藝術社", special: false },
    { id: 26, name: "繩藝編織創作藝術社", special: false },
    { id: 27, name: "魔術社", special: false },
    { id: 28, name: "桌遊社", special: false },
    { id: 29, name: "桌上型密室逃脫社", special: false },
    { id: 30, name: "插畫研究社", special: false }
  ];

  var ROUND_RULES = {
    1: "隨機抽籤決定順序",
    2: "第 1 次順序完全反轉（最後一號優先）",
    3: "從正中間往前排到 1 號，再接最後一號往回排到中間",
    4: "從正中間之後往後排到最後一號，再接 1 號往回排到中間"
  };

  function defaultState() {
    return {
      classSize: 32,
      className: "",
      clubs: DEFAULT_CLUBS.map(function (c) { return { id: c.id, name: c.name, special: c.special }; }),
      nextClubId: 31,
      specialApps: {},
      generalPicks: {},
      lottery: { round: 1, progress: { "1": [], "2": [], "3": [], "4": [] }, currentSeat: null },
      updatedAt: 0
    };
  }

  function normalizeState(raw) {
    var base = defaultState();
    if (!raw || typeof raw !== "object") return base;
    var s = {};
    s.classSize = (typeof raw.classSize === "number" && raw.classSize > 0) ? Math.floor(raw.classSize) : base.classSize;
    s.className = (typeof raw.className === "string") ? raw.className : base.className;
    s.clubs = Array.isArray(raw.clubs) ? raw.clubs.map(function (c) {
      return { id: Number(c.id), name: String(c.name || "未命名社團"), special: !!c.special };
    }).filter(function (c) { return !isNaN(c.id); }) : base.clubs;
    if (s.clubs.length === 0) s.clubs = base.clubs;
    var maxId = s.clubs.reduce(function (m, c) { return Math.max(m, c.id); }, 0);
    s.nextClubId = (typeof raw.nextClubId === "number" && raw.nextClubId > maxId) ? raw.nextClubId : (maxId + 1);

    s.specialApps = {};
    s.clubs.filter(function (c) { return c.special; }).forEach(function (c) {
      var arr = raw.specialApps && raw.specialApps[c.id];
      s.specialApps[c.id] = toSlots(arr);
    });

    s.generalPicks = {};
    s.clubs.filter(function (c) { return !c.special; }).forEach(function (c) {
      var gp = raw.generalPicks && raw.generalPicks[c.id];
      if (gp && typeof gp === "object") {
        s.generalPicks[c.id] = {
          must: (typeof gp.must === "number") ? gp.must : null,
          waitlist: toSlots(gp.waitlist)
        };
      } else {
        s.generalPicks[c.id] = { must: null, waitlist: [null, null, null, null, null] };
      }
    });

    s.lottery = { round: 1, progress: { "1": [], "2": [], "3": [], "4": [] }, currentSeat: null };
    if (raw.lottery && typeof raw.lottery === "object") {
      var r = Number(raw.lottery.round);
      s.lottery.round = (r >= 1 && r <= 4) ? r : 1;
      if (raw.lottery.progress && typeof raw.lottery.progress === "object") {
        ["1", "2", "3", "4"].forEach(function (k) {
          var arr = raw.lottery.progress[k];
          if (Array.isArray(arr)) s.lottery.progress[k] = arr.filter(function (n) { return typeof n === "number"; });
        });
      }
      s.lottery.currentSeat = (typeof raw.lottery.currentSeat === "number") ? raw.lottery.currentSeat : null;
    }
    s.updatedAt = (typeof raw.updatedAt === "number") ? raw.updatedAt : 0;
    return s;
  }

  function clubById(state, id) {
    for (var i = 0; i < state.clubs.length; i++) if (state.clubs[i].id === id) return state.clubs[i];
    return null;
  }
  function generalClubs(state) { return state.clubs.filter(function (c) { return !c.special; }); }
  function specialClubs(state) { return state.clubs.filter(function (c) { return c.special; }); }
  function getGP(state, clubId) {
    if (!state.generalPicks[clubId]) state.generalPicks[clubId] = { must: null, waitlist: [null, null, null, null, null] };
    return state.generalPicks[clubId];
  }
  var SLOT_COUNT = 5;
  function toSlots(arr) {
    var out = [null, null, null, null, null];
    if (!Array.isArray(arr)) return out;
    var seen = {}; var i = 0;
    for (var k = 0; k < arr.length && i < SLOT_COUNT; k++) {
      var v = arr[k];

  function computeRoundOrder(baseOrder, round) {
    var N = baseOrder.length;

    if (round === 1) return baseOrder.slice();

    var mid = Math.ceil(N / 2);
    var idxs = [];
    if (round === 3) {

      for (var j = N; j >= mid + 1; j--) idxs.push(j);
    } else if (round === 4) {
      for (var k = mid + 1; k <= N; k++) idxs.push(k);
      for (var m = 1; m <= mid; m++) idxs.push(m);

  function seatStatus(state, seat, assignments, specialMap) {

    }

    if (a.mustClubs.length >= 1) {

    var n = a.waitlistClubs.length;

    if (n < 3) return { state: "warn", label: "候補僅 " + n + " 個，尚缺 " + (3 - n) + " 個" };
    if (n > 3) return { state: "bad", label: "候補超過三個（" + n + " 個），請確認" };

  // All four rounds' fixed orders at once — for the "show everyone all four

  function allRoundSequences() {

  }

      // round 1's result) — there's nothing left to chance, so reveal the
      // next person directly instead of running the random-looking roll
      // animation, which would misleadingly suggest another live draw.
      finishDraw(currentRoundSequence()[drawn.length]);

    var winner = remaining[Math.floor(Math.random() * remaining.length)];

    var a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function timestampSlug(d) {
    d = d || new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "-" + pad2(d.getHours()) + pad2(d.getMinutes());
  }

  // ---- full-state backup (.json) — for restoring data, not for printing ----
  function exportBackup() {
    state.updatedAt = Date.now();
    var payload = { app: "club-signup", version: 1, exportedAt: Date.now(), state: state };
    var filename = "社團選填備份" + (state.className ? "_" + state.className : "") + "_" + timestampSlug() + ".json";
    triggerDownload(filename, JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
  }

  function importBackupFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (e) {
        window.alert("這個檔案不是有效的備份檔（JSON 格式錯誤），請確認選擇的是「匯出備份」產生的 .json 檔。");
        return;
      }
      var raw = (parsed && parsed.state && typeof parsed.state === "object") ? parsed.state : parsed;
      if (!raw || typeof raw !== "object" || !Array.isArray(raw.clubs)) {
        window.alert("這個檔案看起來不是社團選填的備份檔，找不到預期的資料內容。");
        return;
      }
      var incoming = normalizeState(raw);
      var whenText = parsed && parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString("zh-TW") : "（未知時間）";
      var summary = "備份內容：\n班級：" + (incoming.className || "（未填）") +
        "\n人數：" + incoming.classSize + " 人" +
        "\n匯出時間：" + whenText +
        "\n\n匯入將會覆蓋目前畫面上的所有資料，確定要匯入嗎？";
      if (!window.confirm(summary)) return;
      state = incoming;
      scheduleSave();
      flash("已從備份檔匯入資料");
    };
    reader.onerror = function () {
      window.alert("讀取檔案失敗，請再試一次。");
    };
    reader.readAsText(file, "utf-8");
  }

  function csvEscape(v) {
    v = String(v == null ? "" : v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function exportSummary() {
    var rows = [];
    rows.push(["高雄市立五福國民中學 社團選填總覽"]);
    rows.push(["班級", state.className || ""]);
    rows.push(["班級人數", state.classSize]);
    rows.push([]);
    rows.push(["班級", "座號", "姓名", "確定中選社團代號", "候補志願1", "候補志願2", "候補志願3", "說明"]);

    var assignments = seatAssignments(state);
    var specialMap = specialSeatMap(state);
    for (var seat = 1; seat <= state.classSize; seat++) {
      var special = specialMap[seat] || [];
      if (special.length) {
        rows.push([state.className || "", seat, "", special[0], "", "", "", special.length > 1 ? "同時登記多個特殊社團甄選：" + special.join("、") : "特殊社團甄選登記"]);
        continue;
      }
      var a = assignments[seat];
      var mustCode = a.mustClubs.length ? a.mustClubs[0] : "";
      var wl = a.waitlistClubs.slice().sort(function (x, y) { return x - y; });
      var note = "";
      var st = seatStatus(state, seat, assignments, specialMap);
      if (st.state !== "ok") note = st.label;
      rows.push([state.className || "", seat, "", mustCode, wl[0] || "", wl[1] || "", wl[2] || "", note]);
    }

    rows.push([]);
    rows.push(["社團代號對照"]);
    rows.push(["社團代號", "社團名稱", "類型"]);
    state.clubs.forEach(function (c) { rows.push([c.id, c.name, c.special ? "特殊社團" : "一般社團"]); });

    rows.push([]);
    rows.push(["本次抽籤選號順序（第 " + state.lottery.round + " 次）"]);
    var seq = state.lottery.progress[String(state.lottery.round)] || [];
    rows.push([seq.length ? seq.join(" → ") : "（尚未抽籤）"]);

    var text = rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n");
    var filename = "社團選填總覽" + (state.className ? "_" + state.className : "") + ".csv";
    // UTF-8 BOM so Excel opens the file with correct Chinese characters instead of mojibake.
    var withBom = "﻿" + text;
    triggerDownload(filename, withBom, "text/csv;charset=utf-8");
  }

  // ---- word export (.docx) — laid out like the school's paper selection form ----
  function docxCell(text, opts) {
    opts = opts || {};
    var run = new docx.TextRun({ text: String(text == null ? "" : text), bold: !!opts.bold, color: opts.color, size: opts.size || 20 });
    return new docx.TableCell({
      shading: opts.fill ? { fill: opts.fill } : undefined,
      verticalAlign: docx.VerticalAlign.CENTER,
      margins: { top: 60, bottom: 60, left: 80, right: 80 },
      children: [new docx.Paragraph({ alignment: opts.align || docx.AlignmentType.CENTER, children: [run] })]
    });
  }
  function docxHeaderCell(text) { return docxCell(text, { bold: true, color: "FFFFFF", fill: "2F5D8A" }); }

  function buildDocxBlob() {
    var headerRow = new docx.TableRow({
      tableHeader: true,
      children: ["班級", "座號", "姓名", "確定中選\n社團代號", "候補志願1", "候補志願2", "候補志願3"].map(function (h) { return docxHeaderCell(h); })
    });
    var assignments = seatAssignments(state);
    var specialMap = specialSeatMap(state);
    var studentRows = [headerRow];
    for (var seat = 1; seat <= state.classSize; seat++) {
      var special = specialMap[seat] || [];
      var must = "", w1 = "", w2 = "", w3 = "";
      if (special.length) {
        must = String(special[0]);
      } else {
        var a = assignments[seat];
        must = a.mustClubs.length ? String(a.mustClubs[0]) : "";
        var wl = a.waitlistClubs.slice().sort(function (x, y) { return x - y; });
        w1 = wl[0] || ""; w2 = wl[1] || ""; w3 = wl[2] || "";
      }
      studentRows.push(new docx.TableRow({
        children: [docxCell(state.className || ""), docxCell(seat, { bold: true }), docxCell(""), docxCell(must), docxCell(w1), docxCell(w2), docxCell(w3)]
      }));
    }
    var studentTable = new docx.Table({
      width: { size: 100, type: docx.WidthType.PERCENTAGE },
      rows: studentRows
    });

    var legendHeader = new docx.TableRow({ tableHeader: true, children: [docxHeaderCell("代號"), docxHeaderCell("社團名稱"), docxHeaderCell("類型")] });
    var legendRows = state.clubs.map(function (c) {
      return new docx.TableRow({ children: [docxCell(c.id, { bold: true }), docxCell(c.name, { align: docx.AlignmentType.LEFT }), docxCell(c.special ? "特殊社團" : "一般社團")] });
    });
    var legendTable = new docx.Table({ width: { size: 60, type: docx.WidthType.PERCENTAGE }, rows: [legendHeader].concat(legendRows) });

    var seq = state.lottery.progress[String(state.lottery.round)] || [];

    var doc = new docx.Document({
      sections: [{
        properties: { page: { size: { orientation: docx.PageOrientation.LANDSCAPE } } },
        children: [
          new docx.Paragraph({ heading: docx.HeadingLevel.HEADING_2, children: [new docx.TextRun({ text: "社團活動選填表", bold: true, size: 32 })] }),
          new docx.Paragraph({ spacing: { after: 200 }, children: [new docx.TextRun({ text: "班級：" + (state.className || "（未填）") + "　　班級人數：" + state.classSize + "　　第 " + state.lottery.round + " 次選填", size: 22 })] }),
          studentTable,
          new docx.Paragraph({ spacing: { before: 300, after: 120 }, children: [new docx.TextRun({ text: "社團代號對照", bold: true, size: 24 })] }),
          legendTable,
          new docx.Paragraph({ spacing: { before: 240 }, children: [new docx.TextRun({ text: "本次抽籤選號順序（第 " + state.lottery.round + " 次）：" + (seq.length ? seq.join("、") : "（尚未抽籤）"), size: 20, color: "5B6478" })] })
        ]
      }]
    });
    return docx.Packer.toBlob(doc);
  }

  function exportDocx() {
    if (typeof docx === "undefined") { window.alert("匯出功能還在載入中，請稍等幾秒再試一次。"); return; }
    buildDocxBlob().then(function (blob) {
      var filename = "社團選填表" + (state.className ? "_" + state.className : "") + ".docx";
      triggerDownload(filename, blob);
    }).catch(function () {
      window.alert("Word 檔案產生失敗，請稍後再試一次。");
    });
  }

  function renderTabs() {
    var tabs = [["draw", "抽籤與選填"], ["special", "特殊社團甄選登記"], ["settings", "設定與社團清單"], ["review", "檢查總覽"]];

    }).join("") + '</div>';
  }

  function renderDraw() {
    var round = state.lottery.round;
    var drawn = state.lottery.progress[String(round)] || [];
    var remaining = currentRoundRemaining();
    var current = state.lottery.currentSeat;
    var isRandomRound = (round === 1);
    var round1Done = state.lottery.progress["1"].length === state.classSize;

    var cells = "";
    if (isRandomRound) {
      // Round 1: the real random draw — grid ordered by seat number, marking
      // which seats have already been drawn (their eventual position doesn't
      // matter here, only whether they've gone yet).
      for (var i = 1; i <= state.classSize; i++) {
        var cls = "lot-cell" + (i === current ? " current" : (drawn.indexOf(i) !== -1 ? " drawn" : ""));
        cells += '<div class="' + cls + '">' + i + '</div>';
      }
    } else {
      // Rounds 2–4: the order is already fixed, so show it AS that order —
      // grid position = turn order, not seat number — so everyone can see
      // the whole line-up at a glance instead of one reveal at a time.
      var seq = currentRoundSequence();
      seq.forEach(function (seatNum, idx) {
        var cls = "lot-cell" + (seatNum === current ? " current" : (idx < drawn.length ? " drawn" : ""));
        cells += '<div class="' + cls + '" title="第 ' + (idx + 1) + ' 位">' + seatNum + '</div>';
      });
    }

    var lotHtml =
      '<div class="lot-col">' +
        '<h2>' + (isRandomRound ? "🎲 抽籤選號" : "📋 依序選填（順序已固定）") + '</h2>' +
        '<div class="lot-display">' +
          '<div class="lot-label">' + (isRandomRound ? "本次抽中" : "目前輪到") + '</div>' +
          '<div class="lot-number' + (current ? "" : " empty") + '" id="lot-number">' + (current || "—") + '</div>' +
          '<div class="lot-stats">' + (isRandomRound ? "已抽" : "已上台") + ' <b>' + drawn.length + '</b> 人　／　全班 <b>' + state.classSize + '</b> 人　／　剩餘 <b>' + remaining.length + '</b> 人</div>' +
        '</div>' +
        '<div class="lot-btn-row">' +
          '<button type="button" class="btn primary" id="draw-btn" data-action="draw" ' + (remaining.length === 0 || rolling ? "disabled" : "") + '>' +
            (remaining.length === 0 ? "✅ 全班已完成" : (isRandomRound ? "🎲 抽籤" : "➡️ 下一位")) +
          '</button>' +
          '<button type="button" class="btn" data-action="reset-round" style="flex:none;">重置本輪</button>' +
        '</div>' +
        (!isRandomRound ? '<p class="hint" style="margin-top:-6px; margin-bottom:14px;">此順序已依第 1 次抽籤結果自動排定，按「下一位」直接依序往下，不會再重新抽籤。</p>' : "") +
        '<div class="lot-overview">' + cells + '</div>' +
      '</div>';

    var allRoundsHtml = "";
    if (round1Done) {
      var seqs = allRoundSequences();
      var seqRows = "";
      for (var pos = 0; pos < state.classSize; pos++) {
        seqRows += '<tr><td class="seat">' + (pos + 1) + '</td>' +
          [1, 2, 3, 4].map(function (r) { return '<td>' + seqs[r][pos] + '</td>'; }).join("") +
          '</tr>';
      }
      allRoundsHtml =
        '<div class="all-rounds-toggle"><button type="button" class="btn ghost" data-action="toggle-all-rounds">' +
          (showAllRounds ? "▲ 隱藏四次完整順序" : "▼ 查看第 1～4 次完整順序（一目了然）") +
        '</button></div>' +
        (showAllRounds
          ? '<div class="table-wrap" style="margin-bottom:16px; max-height:340px; overflow-y:auto;"><table class="rounds-table"><thead><tr><th>順序</th><th>第1次</th><th>第2次</th><th>第3次</th><th>第4次</th></tr></thead><tbody>' + seqRows + '</tbody></table></div>'
          : "");
    }

    var clubs = generalClubs(state);
    var rows = clubs.map(function (c) {
      var gp = getGP(state, c.id);
      var slotInputs = gp.waitlist.map(function (v, i) {
        return '<input type="text" inputmode="numeric" class="slot-input' + (v ? " filled" : "") + '" data-field="general-waitlist-slot" data-club="' + c.id + '" data-slot="' + i + '" value="' + (v || "") + '" />';
      }).join("");
      return (
        '<tr>' +
          '<td class="name-cell">' + escapeHtml(c.name) + '</td>' +
          '<td><input type="text" class="must-input" inputmode="numeric" data-field="general-must" data-club="' + c.id + '" value="' + (gp.must || "") + '" placeholder="座號" /></td>' +
          '<td><div class="slot-row">' + slotInputs + '</div></td>' +
        '</tr>'
      );
    }).join("");

    var fillHtml =
      '<div class="lot-col">' +
        '<h2>📋 一般社團選填</h2>' +
        (current
          ? '<div class="pick-banner">請 <span class="seat-badge">座號 ' + current + '</span> 上台選擇社團</div>'
          : '<div class="pick-banner" style="color:var(--ink-faint); font-weight:500;">' + (isRandomRound ? "尚未開始抽籤" : "尚未開始") + '</div>') +
        (uiMessage ? '<div class="ui-message">⚠ ' + escapeHtml(uiMessage) + '</div>' : '') +
        '<div class="table-wrap pick-scroll"><table class="pick-table">' +
          '<colgroup><col /><col style="width:104px;" /><col style="width:300px;" /></colgroup>' +
          '<thead><tr><th>社團名稱</th><th>必上（座號）</th><th>候補（最多 5 位）</th></tr></thead>' +
          '<tbody>' + (rows || '<tr><td colspan="3" class="empty-state">目前沒有一般社團，請到「設定與社團清單」新增。</td></tr>') + '</tbody>' +
        '</table></div>' +
      '</div>';

    return (
      '<div class="panel">' +
        '<div class="round-banner"><span class="round-title">第 ' + round + ' 次選填</span><span class="round-rule">' + ROUND_RULES[round] + '</span></div>' +
        '<div class="stage-white">' + allRoundsHtml + '<div class="split-grid">' + lotHtml + fillHtml + '</div></div>' +
      '</div>'
    );
  }

          '<h2>抽籤輪次（兩年四學期循環）</h2>' +
          '<p class="hint">第 1 次為真正隨機抽籤；第 2～4 次會依第 1 次的結果自動算出固定順序（詳見下方規則），不需要重新抽籤，藉此讓每位同學四次下來的平均優先順位一致。</p>' +
          '<div class="field-row"><label for="round-select">目前輪次</label><select id="round-select" data-field="round">' + roundOptions + '</select></div>' +
          '<p class="note">第 1 次抽籤順序：' + escapeHtml(round1Preview) + (round1Done ? '（已完成，共 ' + state.classSize + ' 人）' : '（進行中，' + state.lottery.progress["1"].length + ' / ' + state.classSize + ' 人）') + '</p>' +
          '<p class="hint" style="margin-top:14px;">💡 <b>下學期換下一次選填時該怎麼做：</b>①「目前輪次」改選下一次（例如第 2 次）；②按下方「清空本學期選填資料」把必上／候補／特殊社團登記清成空白，讓學生重新填寫——社團清單、班級人數、抽籤順序都不會被動到。</p>' +
          '<div class="field-row" style="margin-top:10px;">' +
            '<button type="button" class="btn danger" data-action="clear-picks">清空本學期選填資料（保留社團清單與抽籤順序）</button>' +
            '<button type="button" class="btn ghost" data-action="new-cycle">開始新的兩年循環（連抽籤順序一起清空）</button>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<h2>社團清單管理</h2>' +
          '<p class="hint">點擊標籤可切換「特殊社團」（需甄選）／「一般社團」。特殊社團會出現在甄選登記頁，一般社團會出現在抽籤與選填頁。</p>' +
          '<div>' + manageRows + '</div>' +
          '<div style="margin-top:12px;"><button type="button" class="btn primary" data-action="add-club">＋ 新增社團</button></div>' +
        '</div>' +

        '<div class="card">' +
          '<h2>匯入新社團清單</h2>' +
          '<p class="hint">貼上清單，每行一筆，格式為「社團名稱,是否特殊」（特殊請填「是」或「特殊」，一般留空或填「否」），例如：<br /><code style="font-family:var(--font-mono); font-size:12px;">合唱團,是<br />桌球社,否</code></p>' +
          '<textarea data-field="import-text" placeholder="貼上社團清單…">' + escapeHtml(importText) + '</textarea>' +
          '<div style="margin-top:10px;"><button type="button" class="btn danger" data-action="apply-import">套用並取代目前清單</button></div>' +
          '<p class="note">套用後將清空目前所有社團的必上／候補／甄選登記資料，請先確認已無需保留的紀錄。</p>' +
        '</div>' +
      '</div>'
    );
  }

  function renderReview() {
    var s = summarize(state);
    var assignments = seatAssignments(state);
    var specialMap = specialSeatMap(state);
    var incompleteRows = ""; var any = false;
    for (var seat = 1; seat <= state.classSize; seat++) {
      var r = seatStatus(state, seat, assignments, specialMap);
      if (r.state !== "ok") { any = true; incompleteRows += '<tr><td class="seat">' + seat + '</td><td><span class="pill ' + (r.state === "bad" ? "bad" : (r.state === "empty" ? "neutral" : "warn")) + '">' + r.label + '</span></td></tr>'; }
    }
    var mustLines = generalClubs(state).map(function (c) {
      var gp = getGP(state, c.id);
      return '<div class="review-club-line"><span class="name">' + escapeHtml(c.name) + '</span><span class="who">' + (gp.must ? "座號 " + gp.must : "尚無") + '</span></div>';
    }).join("");
    var waitlistLines = generalClubs(state).map(function (c) {
      var seats = getGP(state, c.id).waitlist.filter(Boolean);
      return '<div class="review-club-line"><span class="name">' + escapeHtml(c.name) + '</span><span class="who">' + seats.length + ' 人' + (seats.length ? '：' + seats.join("、") : "") + '</span></div>';
    }).join("");
    var specialLines = specialClubs(state).map(function (c) {
      var seats = getSpecialSlots(state, c.id).filter(Boolean);
      return '<div class="review-club-line"><span class="name">' + escapeHtml(c.name) + '</span><span class="who">' + seats.length + ' 人' + (seats.length ? '：' + seats.join("、") : "") + '</span></div>';
    }).join("");

    return (
      '<div class="panel">' +
        '<div class="card">' +
          '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;"><h2 style="margin:0;">未完成名單（座號 1–' + state.classSize + '）</h2>' +
          '<div style="display:flex; gap:8px;"><button type="button" class="btn" data-action="export-summary">匯出總覽（.csv）</button><button type="button" class="btn primary" data-action="export-docx">匯出選填表（.docx）</button></div></div>' +
          (any
            ? '<div class="table-wrap" style="margin-top:12px;"><table><thead><tr><th class="seat">座號</th><th>原因</th></tr></thead><tbody>' + incompleteRows + '</tbody></table></div>'
            : '<p class="empty-state">全班 ' + s.total + ' 位同學都已完成填寫。</p>') +
        '</div>' +
        '<div class="two-col">' +
          '<div class="card"><h2>一般社團必上人選</h2>' + mustLines + '</div>' +
          '<div class="card"><h2>一般社團候補人數</h2>' + waitlistLines + '</div>' +
        '</div>' +
        '<div class="card"><h2>特殊社團甄選登記人數</h2>' + (specialLines || '<p class="empty-state">尚未設定特殊社團。</p>') + '</div>' +
      '</div>'
    );
  }

  function renderTabContent() {
    if (currentTab === "draw") return renderDraw();
    if (currentTab === "special") return renderSpecial();
    if (currentTab === "settings") return renderSettings();
    if (currentTab === "review") return renderReview();
    return "";
  }

  function render() {
    var scrollY = window.scrollY;
    app.innerHTML = renderHeader() + renderStatusStrip() + renderTabs() + renderTabContent() +
      '<p class="footer-note">資料會自動保存在這台裝置的這個瀏覽器裡；建議定期到「設定與社團清單」匯出備份，換裝置或清除瀏覽器資料前尤其重要。</p>';
    window.scrollTo(0, scrollY);
    updateSaveIndicatorOnly();
    syncPickScrollHeight();
  }

  // Let the right-hand club list fill exactly as much vertical space as the
  // left lottery panel naturally takes up — instead of guessing a fixed
  // viewport offset — so as many rows as possible are visible before the
  // (independently scrollable) list needs to scroll at all.
  function syncPickScrollHeight() {
    var lotCol = app.querySelector(".split-grid > .lot-col:first-child");
    var pickScroll = app.querySelector(".pick-scroll");
    if (!pickScroll) return;
    var wide = (typeof window.matchMedia === "function") ? window.matchMedia("(min-width: 881px)").matches : true;
    if (!lotCol || !wide) { pickScroll.style.maxHeight = ""; return; }
    pickScroll.style.maxHeight = Math.max(320, lotCol.offsetHeight) + "px";
  }

  // ---- event delegation ----------------------------------------------
  app.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === "set-tab") { currentTab = btn.dataset.tab; uiMessage = null; render(); }
    else if (action === "add-club") { addClub(); }
    else if (action === "delete-club") { deleteClub(btn.dataset.club); }
    else if (action === "toggle-special") { toggleSpecial(btn.dataset.club); }
    else if (action === "apply-import") { applyImport(); }
    else if (action === "export-summary") { exportSummary(); }
    else if (action === "export-docx") { exportDocx(); }
    else if (action === "export-backup") { exportBackup(); }
    else if (action === "pick-backup-file") {
      var fileInput = app.querySelector('[data-field="backup-file"]');
      if (fileInput) fileInput.click();
    }
    else if (action === "draw") { drawNext(); }
    else if (action === "reset-round") { resetRoundProgress(); }
    else if (action === "toggle-all-rounds") { showAllRounds = !showAllRounds; render(); }
    else if (action === "new-cycle") { startNewCycle(); }
    else if (action === "clear-picks") { clearAllPicks(); }
  });

  app.addEventListener("change", function (e) {
    var el = e.target.closest("[data-field]");
    if (!el) return;
    var field = el.dataset.field;
    if (field === "class-size") setClassSize(parseInt(el.value, 10));
    else if (field === "class-name") setClassName(el.value);
    else if (field === "club-name") renameClub(el.dataset.club, el.value);
    else if (field === "special-seat-slot") setSpecialSeatSlot(Number(el.dataset.club), Number(el.dataset.slot), el.value);
    else if (field === "general-must") setGeneralMust(Number(el.dataset.club), el.value);
    else if (field === "general-waitlist-slot") setGeneralWaitlistSlot(Number(el.dataset.club), Number(el.dataset.slot), el.value);
    else if (field === "round") setRound(el.value);
    else if (field === "backup-file") {
      var file = el.files && el.files[0];
      importBackupFile(file);
      el.value = "";
    }
  });

  app.addEventListener("input", function (e) {
    var el = e.target.closest("[data-field='import-text']");
    if (!el) return;
    importText = el.value;
  });

  // Flush to local storage (and try one last cloud save) whenever this tab
  // is about to be backgrounded or unloaded — e.g. the moment the native
  // share sheet opens for a docx/csv export — instead of relying only on
  // the 1100ms debounce timer, which can be starved right at that moment.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flushSaveNow();
  });
  window.addEventListener("pagehide", flushSaveNow);

  // Re-measure the right-hand list's height cap on resize/orientation change
  // (e.g. rotating the iPad, or entering/leaving Split View) — debounced
  // since resize fires rapidly during the transition.
  var resizeSyncTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeSyncTimer);
    resizeSyncTimer = setTimeout(syncPickScrollHeight, 120);
  });

  // ---- boot ----------------------------------------------------
  render();
  Promise.all([getCapability("artifact"), getCapability("downloads")]).then(function (res) {
    artifactNS = res[0]; downloadsNS = res[1];
    return loadFromServer(false);
  }).then(function () { render(); });
})();
</script>
